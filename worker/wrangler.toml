name = "hwl-service-finder"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# The GitHub Pages origin (no path, no trailing slash). Anything else gets a 403.
# The addresses the pages are served from, separated by commas. The site's own domain, plus the GitHub Pages
# address it started on. http://hwlsupportfinder.org.uk is only there until GitHub Pages has issued the HTTPS
# certificate and "Enforce HTTPS" is ticked; remove it then.
ALLOWED_ORIGIN = "https://hwlsupportfinder.org.uk,https://www.hwlsupportfinder.org.uk,http://hwlsupportfinder.org.uk,https://healthy-working-life-kirklees.github.io"
ANTHROPIC_MODEL = "claude-sonnet-5-5"
MAX_PER_DAY = "100"
# User feedback (worker/src/feedback.js). Set FEEDBACK_ENABLED to "false" to switch sending off; the page
# then hides the feedback links. MAX_FEEDBACK_PER_DAY is a global cap on feedback entries a day.
FEEDBACK_ENABLED = "true"
MAX_FEEDBACK_PER_DAY = "300"
# The fuller "Give pilot feedback" form for pilot testers (site/feedback.js). Off unless exactly "true".
PILOT_FEEDBACK = "true"
# Feedback emails (worker/src/notify.js): each new entry, apart from a plain "Yes, it was helpful", is emailed
# to the admins as well as stored. Who it goes to is the FEEDBACK_EMAIL_TO secret (comma-separated), kept out of
# this public file; each address must be a verified destination address in Cloudflare Email Routing, which is
# free on the Workers Free plan. See "Feedback emails" in README.md. Without it nothing is sent and feedback is
# still stored.
FEEDBACK_EMAIL_FROM = "feedback@hwlsupportfinder.org.uk"
# Linked from each feedback email.
FEEDBACK_REVIEW_URL = "https://hwlsupportfinder.org.uk/admin/feedback.html"
# The finder's address, for the review links in the morning reminder email (worker/src/reminders.js).
SITE_URL = "https://hwlsupportfinder.org.uk/"
# Anonymous usage counts (worker/src/usage.js): daily tallies only, nothing that identifies anyone. Set
# USAGE_ENABLED to "false" to stop counting. MAX_USAGE_PER_DAY caps how many counts are added in a day.
USAGE_ENABLED = "true"
MAX_USAGE_PER_DAY = "20000"
# "Apply changes now" on the All services page (worker/src/applynow.js) starts the Apply team changes workflow
# in this repository. It's off until the GH_ACTIONS_TOKEN secret is set (see the README).
GH_REPO = "Healthy-Working-Life-Kirklees/service-finder"
# ANTHROPIC_API_KEY, TEAM_PASSCODE, GH_ACTIONS_TOKEN and FEEDBACK_EMAIL_TO are secrets: add them in the Cloudflare dashboard
# (Workers > hwl-service-finder > Settings > Variables and Secrets). Never put them in this file.

# Sends the feedback emails (Cloudflare Email Service). On the Workers Free plan it can only send to verified
# destination addresses in Email Routing, so it can't be used to email anyone else.
[[send_email]]
name = "FEEDBACK_EMAIL"

# Each morning at 06:40 UK winter time (07:40 in summer): emails the team about projects that end or stop taking
# referrals in the next 30 days, with a review link to forward to each organisation (worker/src/reminders.js).
[triggers]
crons = ["40 6 * * *"]

# No Workers Logs: nothing about a conversation should be kept anywhere.
[observability]
enabled = false

# Let wrangler import the Markdown prompt as text.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Per-IP burst limit (per Cloudflare location; not strict abuse protection on its own).
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "7301"
[ratelimits.simple]
limit = 10
period = 60

# Global daily counter. SQLite-backed, which is the kind the free plan allows.
[[durable_objects.bindings]]
name = "CAP_COUNTER"
class_name = "DailyCap"

# Team issues log for the Admin pages (only active if the TEAM_PASSCODE secret is set).
[[durable_objects.bindings]]
name = "LOG_STORE"
class_name = "LogStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailyCap"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LogStore"]

# Rate limit for the team log routes.
[[ratelimits]]
name = "LOG_LIMITER"
namespace_id = "7302"
[ratelimits.simple]
limit = 60
period = 60

# User feedback store. Kept separate from the team log so it keeps working when the log is switched off.
[[durable_objects.bindings]]
name = "FEEDBACK_STORE"
class_name = "FeedbackStore"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["FeedbackStore"]

# Per-IP limit for sending feedback.
[[ratelimits]]
name = "FEEDBACK_LIMITER"
namespace_id = "7303"
[ratelimits.simple]
limit = 5
period = 60

# Per-IP limit for the passcode-protected feedback routes (slows down passcode guessing).
[[ratelimits]]
name = "FEEDBACK_READ_LIMITER"
namespace_id = "7304"
[ratelimits.simple]
limit = 30
period = 60

# Anonymous usage counts (daily tallies only). Read with the team passcode (TEAM_PASSCODE) on the Feedback and usage page.
[[durable_objects.bindings]]
name = "USAGE_STORE"
class_name = "UsageStore"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["UsageStore"]

# Per-IP limit for usage events from the page (page visits and link clicks).
[[ratelimits]]
name = "USAGE_LIMITER"
namespace_id = "7305"
[ratelimits.simple]
limit = 60
period = 60

# ---------------------------------------------------------------------------------------------------------
# PREVIEW: a separate Worker for trying out changes before they go live.
#
# Deployed by .github/workflows/preview.yml whenever the "experimental" branch is pushed, as its own Worker
# called hwl-service-finder-preview. It serves the preview pages itself (from worker/preview-site/, built by
# the workflow) as well as /chat, so the pages and the AI share one address and nothing on GitHub Pages or
# the live Worker changes. It has its own daily cap, team log, feedback and usage counts.
#
# Secrets are per Worker, so the preview needs its own ANTHROPIC_API_KEY (and TEAM_PASSCODE /
# TEAM_PASSCODE for the Admin pages). The workflow copies them from the GitHub secrets
# of the same names when they exist; otherwise add them in the Cloudflare dashboard
# (Workers > hwl-service-finder-preview > Settings > Variables and Secrets).
#
# Most settings below repeat the ones above because Cloudflare doesn't carry them into an environment.
# ---------------------------------------------------------------------------------------------------------
[env.preview]
workers_dev = true

[env.preview.assets]
directory = "./preview-site"
not_found_handling = "none"

[env.preview.vars]
# The preview's pages come from the Worker itself, so it accepts requests from its own address only.
ALLOWED_ORIGIN = ""
ALLOW_SELF_ORIGIN = "true"
ANTHROPIC_MODEL = "claude-sonnet-5-5"
# Lower than live: this is for a small group of testers.
MAX_PER_DAY = "60"
FEEDBACK_ENABLED = "true"
MAX_FEEDBACK_PER_DAY = "100"
PILOT_FEEDBACK = "true"
USAGE_ENABLED = "true"
MAX_USAGE_PER_DAY = "5000"
# Left out on purpose: the send_email binding and FEEDBACK_EMAIL_FROM (feedback on the preview is never
# emailed to the team), and GH_REPO ("Apply changes now" on the preview would change the main branch).

[env.preview.observability]
enabled = false

# No morning reminder emails from the preview.
[env.preview.triggers]
crons = []

[[env.preview.ratelimits]]
name = "IP_LIMITER"
namespace_id = "7311"
[env.preview.ratelimits.simple]
limit = 10
period = 60

[[env.preview.ratelimits]]
name = "LOG_LIMITER"
namespace_id = "7312"
[env.preview.ratelimits.simple]
limit = 60
period = 60

[[env.preview.ratelimits]]
name = "FEEDBACK_LIMITER"
namespace_id = "7313"
[env.preview.ratelimits.simple]
limit = 5
period = 60

[[env.preview.ratelimits]]
name = "FEEDBACK_READ_LIMITER"
namespace_id = "7314"
[env.preview.ratelimits.simple]
limit = 30
period = 60

[[env.preview.ratelimits]]
name = "USAGE_LIMITER"
namespace_id = "7315"
[env.preview.ratelimits.simple]
limit = 60
period = 60

[[env.preview.durable_objects.bindings]]
name = "CAP_COUNTER"
class_name = "DailyCap"

[[env.preview.durable_objects.bindings]]
name = "LOG_STORE"
class_name = "LogStore"

[[env.preview.durable_objects.bindings]]
name = "FEEDBACK_STORE"
class_name = "FeedbackStore"

[[env.preview.durable_objects.bindings]]
name = "USAGE_STORE"
class_name = "UsageStore"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["DailyCap", "LogStore", "FeedbackStore", "UsageStore"]
