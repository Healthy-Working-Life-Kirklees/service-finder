name: Apply team changes
run-name: "Apply team changes${{ inputs.auto_merge && ' and put them live' || '' }}${{ inputs.requested_by && format(' (from the All services page, {0})', inputs.requested_by) || '' }}"

# The "button" for the development team's changes from the All services page: Actions > Apply team changes > Run workflow.
# It fetches the team's new services, edits and listing decisions from the Worker, writes them into data/services/, checks the
# data, and opens a pull request with a summary of what changed. Nothing goes live until that pull request is merged.
#
# "Apply changes now" on the All services page runs this with auto_merge on (through the Worker, worker/src/applynow.js):
# if the data check and tests pass, the pull request is merged straight away and both deploys are started, so the
# changes are live in a few minutes. If anything fails, nothing is merged. Run from here, it still waits for you to merge.
#
# One-off setup (see the README, "Reviewing which services are live, and editing details"):
#   - Settings > Secrets and variables > Actions > Secrets: add TEAM_PASSCODE (the same value as the Worker secret).
#   - The WORKER_URL variable is already used by the Pages deploy.
#   - Settings > Actions > General > Workflow permissions: tick "Allow GitHub Actions to create and approve pull requests".

on:
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview only: show what would change, without opening a pull request"
        type: boolean
        default: false
      auto_merge:
        description: "Put the changes live straight away if the checks pass (merge and deploy). The All services page button uses this."
        type: boolean
        default: false
      requested_by:
        description: "Who asked (filled in by the All services page)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write   # to start the deploys after an automatic merge

concurrency:
  group: apply-team-changes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the setup
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          TEAM_PASSCODE: ${{ secrets.TEAM_PASSCODE }}
        run: |
          missing=""
          [ -n "$WORKER_URL" ] || missing="$missing the WORKER_URL variable,"
          [ -n "$TEAM_PASSCODE" ] || missing="$missing the TEAM_PASSCODE secret,"
          if [ -n "$missing" ]; then
            echo "::error::This needs${missing%,} (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Apply the team's decisions and edits
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          TEAM_PASSCODE: ${{ secrets.TEAM_PASSCODE }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          npm ci
          if [ "$PREVIEW" = "true" ]; then extra=--dry-run; else extra=; fi
          npm run -s apply-decisions -- $extra > "$RUNNER_TEMP/summary.md"
          # Wards and map positions for any new venues, from their postcodes (postcodes.io).
          if [ "$PREVIEW" != "true" ]; then node scripts/lookup-venues.mjs | tee -a "$RUNNER_TEMP/summary.md"; fi
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # The same checks a pull request gets. If the changes would break the data, stop here and open nothing.
      - name: Check the data
        run: |
          npm run check-data
          node worker/test/logic.mjs > "$RUNNER_TEMP/tests.txt" || { tail -40 "$RUNNER_TEMP/tests.txt"; exit 1; }
          tail -1 "$RUNNER_TEMP/tests.txt"

      - name: Open a pull request
        if: ${{ !inputs.preview }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          AUTO_MERGE: ${{ inputs.auto_merge }}
          REQUESTED_BY: ${{ inputs.requested_by }}
        run: |
          # git status, not git diff, so brand-new service files count too.
          # data/organisations.json and data/venues.json too: combining or renaming an organisation or a venue can
          # change only that file.
          if [ -z "$(git status --porcelain -- data/services data/organisations.json data/venues.json)" ]; then
            echo "Nothing to apply: the data already matches the team's decisions and edits." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A new branch for every run and every re-run (GITHUB_RUN_ATTEMPT), so a re-run never collides with a
          # branch an earlier attempt already pushed. Each run applies everything the team has saved, so the newest
          # branch always includes what older ones had.
          branch="team-changes/$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/services data/organisations.json data/venues.json
          if [ -n "$REQUESTED_BY" ]; then who="Requested by $REQUESTED_BY on the All services page."; else who="Run by $ACTOR from the Apply team changes workflow."; fi
          git commit -q -m "Apply the development team's decisions and edits ($(date -u +%Y-%m-%d))" -m "$who"
          git push -q origin "$branch"
          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "---"
            if [ "$AUTO_MERGE" = "true" ]; then
              echo "Opened and merged by the [Apply team changes]($RUN_URL) workflow: \"Apply changes now\" on the All services page, requested by ${REQUESTED_BY:-someone on the team}. The data check and Worker tests passed in that run."
            else
              echo "Opened by the [Apply team changes]($RUN_URL) workflow, run by @$ACTOR. The data check and Worker tests passed in that run. Merge to put these changes live."
            fi
          } > "$RUNNER_TEMP/body.md"
          if url=$(gh pr create --base main --head "$branch" --title "Apply the development team's decisions and edits ($(date -u '+%-d %b %Y'))" --body-file "$RUNNER_TEMP/body.md"); then
            echo "Pull request: $url" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$AUTO_MERGE" = "true" ]; then
              # The checks above passed, so merge now. A merge made with this workflow's token doesn't start other
              # workflows by itself, so start both deploys (the site and the Worker both carry the live list).
              if ! gh pr merge "$url" --merge --delete-branch; then
                echo "::error::The pull request couldn't be merged automatically (has main changed?). It's open for review: $url"
                echo "### Not merged: the pull request is open for review" >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              gh workflow run pages.yml --ref main
              gh workflow run worker.yml --ref main
              echo "Merged, and the site and Worker deploys have started. The changes will be live in a few minutes." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            # Usually because Settings > Actions > General > Workflow permissions doesn't allow GitHub Actions to
            # create pull requests. The changes are safely on the branch, so say how to open the pull request by hand.
            compare="${{ github.server_url }}/${{ github.repository }}/compare/main...${branch}?expand=1"
            {
              echo "### The changes are on branch \`$branch\`, but the pull request couldn't be opened"
              echo
              echo "Open it yourself here: $compare (paste in the summary above as its description)."
              echo
              echo "To let this button open pull requests itself next time: Settings > Actions > General > Workflow permissions > tick **Allow GitHub Actions to create and approve pull requests** > Save."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The pull request couldn't be opened. The changes are on branch $branch: open a pull request from $compare. To fix this for next time, tick 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General."
            exit 1
          fi
