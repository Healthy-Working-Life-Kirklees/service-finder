name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "mvp/**"
      - "data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Check the scheme files, then combine them into services.json. A problem in the data stops the deploy.
      - name: Check and build the scheme data
        run: |
          npm ci
          npm run check-data
          npm run build-data

      - name: Assemble the site
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          MVP_TOOLS: ${{ vars.MVP_TOOLS }}
        run: |
          mkdir _site
          cp -r site/. _site/
          cp data/services.json _site/services.json
          # The help page and issues log are for the MVP team only. They are included only when the
          # repository variable MVP_TOOLS is exactly "true". Leave it unset or "false" for the wider test.
          MVP=false
          if [ "$MVP_TOOLS" = "true" ]; then
            MVP=true
            cp -r mvp _site/mvp
            rm -f _site/mvp/README.md
          fi
          # Tell the page where the Worker is and whether the MVP tools are on.
          printf 'window.FINDER_CONFIG = %s;' "$(jq -cn --arg api "$WORKER_URL" --argjson mvp "$MVP" '{apiBase: $api, mvpTools: $mvp}')" > _site/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
