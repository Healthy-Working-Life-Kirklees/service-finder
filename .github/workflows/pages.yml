name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "admin/**"
      - "data/**"
      - "scripts/**"
      - "print/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Check the scheme files, then combine them into services.json. A problem in the data stops the deploy.
      - name: Check and build the scheme data
        run: |
          npm ci
          npm run check-data
          npm run build-data

      - name: Assemble the site
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          mkdir _site
          cp -r site/. _site/
          # The live list only: services whose listing decision is "include".
          cp data/services.json _site/services.json
          # The printable directory (directory.html), built from the same live list. See print/README.md.
          node scripts/build-print.mjs --site _site
          # The Admin section (admin/), for the development team. Every Admin page sends you to the Admin home
          # page to sign in with the team passcode first (admin/team-auth.js), and the team's data only comes
          # from the Worker with that passcode.
          cp -r admin _site/admin
          # Every service, including those waiting for review or excluded, for the All services page only.
          cp data/services-all.json _site/admin/services-all.json
          rm -f _site/admin/README.md
          # The Admin pages used to live at /mvp/. Keep those old links (bookmarks, earlier feedback emails) working.
          mkdir _site/mvp
          for page in index help services log feedback; do
            to="../admin/$page.html"; [ "$page" = index ] && to="../admin/"
            printf '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0; url=%s"><title>Moved</title><p>This page has moved to <a href="%s">Admin</a>.</p>\n' "$to" "$to" > "_site/mvp/$page.html"
          done
          # Tell the pages where the Worker is.
          printf 'window.FINDER_CONFIG = %s;' "$(jq -cn --arg api "$WORKER_URL" '{apiBase: $api}')" > _site/config.js

      # The PDF of the printable directory, for the "Download PDF" link on directory.html, made with the runner's
      # Google Chrome. If it fails, the site still deploys and the link stays hidden. See print/README.md.
      - name: Make the directory PDF
        continue-on-error: true
        run: node scripts/render-print-pdf.mjs _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
