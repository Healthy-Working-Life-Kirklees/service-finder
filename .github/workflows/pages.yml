name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          mkdir _site
          cp -r site/. _site/
          cp data/services.json _site/services.json
          # Tell the page where the Worker is (repository variable WORKER_URL).
          printf 'window.FINDER_CONFIG = { apiBase: %s };\n' "$(jq -Rn --arg v "$WORKER_URL" '$v')" > _site/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
