name: Deploy Worker to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "data/**"
      - "prompt/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      # Check the scheme files, then combine them into services.json, which the Worker bundles.
      # A problem in the data stops the deploy.
      - name: Check and build the scheme data
        run: |
          npm ci
          npm run check-data
          npm run build-data
      - name: Install
        working-directory: worker
        run: npm ci
      - name: Deploy
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
